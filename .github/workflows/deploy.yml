name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false  # never cancel an in-flight deploy

jobs:
  deploy:
    name: Deploy to raven-ai.online
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (for health check only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Run deploy script on server
        run: |
          ssh -p ${{ secrets.DEPLOY_PORT || 22 }} \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "bash ~/raven-enterprise-bot/deploy/deploy.sh"

      - name: Health check — API
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 \
            https://api.raven-ai.online/health \
            || (echo "API health check failed" && exit 1)

      - name: Health check — Dashboard
        run: |
          curl --fail --retry 3 --retry-delay 5 \
            https://app.raven-ai.online \
            || (echo "Dashboard health check failed" && exit 1)

      - name: Health check — Admin console
        run: |
          curl --fail --retry 3 --retry-delay 5 \
            https://admin.raven-ai.online \
            || (echo "Admin console health check failed" && exit 1)
